name: CI/CD — test → build → deploy

# test   : GitHub-hosted Ubuntu, no secrets, offline pytest (also on pull requests)
# build  : self-hosted Windows PC, only for pushes to main, only if test passed
# deploy : self-hosted Windows PC, only if build passed — blue-green behind nginx, /health version check, rollback
# The if-guards below are NOT a security boundary: a pull_request run uses the workflow file from the PR itself.
# Fork PRs are stopped by Settings > Actions > "Require approval for all external contributors" (self-hosted runner).
# Actions are pinned to commit SHAs (tags can be moved).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/paper-universe
  SERVICE_URL: http://127.0.0.1:8090
  OUT: ${{ github.workspace }}\deploy-logs

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies (no torch, no model)
        run: pip install -r requirements-dev.txt
      - name: Run tests (offline, fake LLM)
        run: pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check Docker is running
        run: |
          docker version --format "Docker engine {{.Server.Version}} ({{.Server.Os}})"
          if ($LASTEXITCODE -ne 0) { throw "Docker Desktop is not running on the runner PC" }

      # The Dockerfile downloads the pinned model and fails the build if it does not load offline.
      # Default (docker) builder: layer cache stays on this PC between runs.
      - name: Build image (model download + offline load check)
        run: |
          docker build --platform linux/amd64 --build-arg APP_VERSION="sha-$($env:GITHUB_SHA.Substring(0,7))" -t paper-universe:ci .
          if ($LASTEXITCODE -ne 0) { throw "docker build failed" }

      - name: Smoke test — /health, UI and analyze API respond
        run: |
          cmd /c "docker rm -f pu-ci >nul 2>&1"
          docker run -d --name pu-ci -p 127.0.0.1:18000:8000 paper-universe:ci | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "container did not start" }
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            try { $s = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:18000/health; $ok = $true }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { throw "/health did not respond within 2 minutes" }
          $h = $s.Content | ConvertFrom-Json
          if ($h.status -ne 'ok' -or $h.version -ne "sha-$($env:GITHUB_SHA.Substring(0,7))") { throw "unexpected /health: $($s.Content)" }
          Write-Host "/health OK: $($s.Content)"
          $ui = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 http://127.0.0.1:18000/
          if ($ui.Content -notmatch '<div id="root">') { throw "UI is not served" }
          $m = Invoke-WebRequest -UseBasicParsing -TimeoutSec 60 -Method Post -ContentType 'application/json' `
            -Body '{"title":"Depth completion from sparse time-of-flight sensors","abstract":"We densify sparse depth."}' http://127.0.0.1:18000/api/model/analyze
          $a = $m.Content | ConvertFrom-Json
          if (-not $a.keywords -or $a.model.app_version -ne "sha-$($env:GITHUB_SHA.Substring(0,7))") { throw "analyze API / version check failed: $($m.Content)" }
          Write-Host "analyze OK: $($a.model.app_version) $($a.model.model_id) -> $($a.keywords -join ', ')"
          docker exec pu-ci sh -c "cd backend && python -m app.keywords"
          if ($LASTEXITCODE -ne 0) { throw "model check failed inside the container" }
          Write-Host "smoke test passed"

      - name: Container logs on failure
        if: failure()
        run: |
          cmd /c "docker logs --tail 100 pu-ci 2>&1"
          exit 0

      - name: Remove test container
        if: always()
        run: |
          cmd /c "docker rm -f pu-ci >nul 2>&1"
          exit 0

      # Explains login failures like "malformed HTTP Authorization header" without ever printing the values.
      - name: Check Docker Hub secrets (format only)
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $bad = $false
          foreach ($k in 'U', 'T') {
            $name = @{ U = 'DOCKERHUB_USERNAME'; T = 'DOCKERHUB_TOKEN' }[$k]
            $v = [Environment]::GetEnvironmentVariable($k)
            if ($null -eq $v) { $v = '' }
            $s = $v.Trim()
            $p = @()
            if ($v -eq '') { $p += 'empty: not a Repository secret, or the name is misspelled' }
            if ($v -ne $s) { $p += 'leading/trailing space or newline' }
            if ($s -match '[^\x21-\x7E]') { $p += 'contains spaces or non-ASCII (e.g. Korean) characters' }
            if ($s -match '^[''"]|[''"]$') { $p += 'wrapped in quotes' }
            if ($k -eq 'U' -and $s -match '@') { $p += 'looks like an email; use the Docker Hub username' }
            if ($k -eq 'U' -and $s -cne $s.ToLower()) { $p += 'has uppercase letters; Docker Hub usernames are lowercase' }
            if ($k -eq 'T' -and $s -and -not $s.StartsWith('dckr_pat_')) { $p += 'does not start with dckr_pat_ (password instead of an access token?)' }
            if ($p.Count) { $bad = $true; Write-Host "${name}: length $($v.Length) -> PROBLEM: $($p -join '; ')" }
            else { Write-Host "${name}: length $($v.Length) -> OK" }
          }
          if ($bad) { exit 1 }

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Push exactly the image that passed the smoke test.
      - name: Push to Docker Hub
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          foreach ($t in ($env:TAGS -split "`r?`n" | Where-Object { $_ })) {
            docker tag paper-universe:ci $t
            if ($LASTEXITCODE -ne 0) { throw "tag failed: $t" }
            docker push $t
            if ($LASTEXITCODE -ne 0) { throw "push failed: $t" }
          }

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows]
    concurrency:
      group: deploy-local
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check Docker is running
        run: |
          docker version --format "Docker engine {{.Server.Version}} ({{.Server.Os}})"
          if ($LASTEXITCODE -ne 0) { throw "Docker Desktop is not running on the runner PC" }

      # "Re-run" of an older green run would otherwise deploy an old commit over a newer one.
      - name: Refuse to deploy a commit that is no longer main HEAD
        if: github.event_name != 'workflow_dispatch'
        run: |
          $head = ((git ls-remote origin refs/heads/main) -split "\s+")[0]
          if ($head -ne $env:GITHUB_SHA) { throw "this run is for $env:GITHUB_SHA but main is $head; use workflow_dispatch for a deliberate rollback" }

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the image CI just pushed
        id: pull
        run: |
          # the build job tagged this commit as sha-<7 chars> (docker/metadata-action type=sha,format=short)
          $tag = "sha-" + $env:GITHUB_SHA.Substring(0, 7)
          $ref = "$($env:IMAGE):$tag"
          docker pull $ref
          if ($LASTEXITCODE -ne 0) { throw "pull failed: $ref" }
          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "deploying $ref"

      # Independent process, started before anything changes; it must see the service healthy first.
      - name: Start monitor and confirm the current service responds
        run: |
          New-Item -ItemType Directory -Force $env:OUT | Out-Null
          Remove-Item "$env:OUT\*" -Force -ErrorAction SilentlyContinue
          # Start-Process (PowerShell 5.1) joins arguments without quoting, so quote every path
          $argv = "-NoProfile -ExecutionPolicy Bypass -File `"$env:GITHUB_WORKSPACE\deploy\monitor.ps1`" " +
                  "-Url `"$env:SERVICE_URL`" -OutFile `"$env:OUT\monitor.jsonl`" -StopFile `"$env:OUT\stop`" -AfterSeconds 30"
          $p = Start-Process powershell -PassThru -WindowStyle Hidden -ArgumentList $argv
          $p.Id | Out-File "$env:OUT\monitor.pid" -Encoding ascii
          Write-Host "monitor pid $($p.Id)"
          $deadline = (Get-Date).AddSeconds(60); $seen = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            if (Test-Path "$env:OUT\monitor.jsonl") {
              $last = Get-Content "$env:OUT\monitor.jsonl" -Tail 1 | ConvertFrom-Json
              if ($last.status -eq 200 -and $last.valid) { $seen = $last; break }
              # first run after the old single-container deploy: no analyze API yet, but the service is up
              if ($last.status -in 404, 405) { $seen = $last; Write-Host "current version has no analyze API yet (status $($last.status)); service is up"; break }
            }
          }
          if (-not $seen) { Write-Host "no running service answered before deploy (first deployment?)" }
          else { Write-Host "pre-deploy response: status=$($seen.status) version=$($seen.version) keywords=$($seen.keywords -join ', ')" }

      - name: Blue-green deploy
        env:
          REF: ${{ steps.pull.outputs.ref }}
          FACTCHAT_API_KEY: ${{ secrets.FACTCHAT_API_KEY }}   # only this step sees the LLM key
        run: |
          if (-not $env:FACTCHAT_API_KEY) { Write-Host "::warning::FACTCHAT_API_KEY secret is empty: the service runs with fallback summaries" }
          & "$env:GITHUB_WORKSPACE\deploy\bluegreen.ps1" -Ref $env:REF -Port 8090 -Events "$env:OUT\events.jsonl" -Want "sha-$($env:GITHUB_SHA.Substring(0,7))"

      - name: Confirm /health serves this commit
        run: |
          $h = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 "$env:SERVICE_URL/health").Content
          Write-Host $h
          if (($h | ConvertFrom-Json).version -ne "sha-$($env:GITHUB_SHA.Substring(0,7))") { throw "/health does not report this commit" }

      - name: Keep monitoring 30 s after deploy
        if: always()
        run: |
          New-Item -ItemType File -Force "$env:OUT\stop" | Out-Null
          $id = Get-Content "$env:OUT\monitor.pid" -ErrorAction SilentlyContinue
          if ($id) { Wait-Process -Id $id -Timeout 90 -ErrorAction SilentlyContinue; Stop-Process -Id $id -Force -ErrorAction SilentlyContinue }
          Write-Host "monitor finished: $((Get-Content "$env:OUT\monitor.jsonl" -ErrorAction SilentlyContinue | Measure-Object).Count) requests"
          exit 0

      - name: Write Summary
        if: always()
        env:
          REF: ${{ steps.pull.outputs.ref }}
        run: |
          & "$env:GITHUB_WORKSPACE\deploy\summary.ps1" -OutDir $env:OUT -Url $env:SERVICE_URL -Results "$env:GITHUB_WORKSPACE\eval\results.json" -Image $env:REF
          Get-Content "$env:OUT\monitor.jsonl" -Encoding UTF8 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          exit 0

      - name: Upload logs (UTF-8)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-monitor-${{ github.run_id }}
          path: deploy-logs/
          if-no-files-found: warn
