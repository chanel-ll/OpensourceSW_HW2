name: CI — build & push Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/paper-universe

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile itself downloads the pinned model and fails the build if it does not load offline.
      - name: Build image (model download + offline load check)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: paper-universe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — app starts, UI and API respond
        run: |
          docker run -d --name app -p 8000:8000 paper-universe:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/status && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/status | grep -q '"llm"'
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'
          docker exec app sh -c 'cd backend && python -m app.keywords'
          echo "smoke test passed"

      - name: Container logs on failure
        if: failure()
        run: docker logs app || true

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Push to Docker Hub (reuses the cached build)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
