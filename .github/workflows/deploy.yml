name: Deploy — zero-downtime blue-green

# After CI pushes a new image, the self-hosted Windows runner deploys it with blue-green switching behind
# an nginx proxy, while an independent monitor checks the live service every second.
# Service: http://127.0.0.1:8090 (data/notes in Docker volumes; settings from %USERPROFILE%\.paper-universe)
on:
  workflow_run:
    workflows: ["CI — build & push Docker image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:     # manual redeploy of :latest

concurrency:
  group: deploy-local
  cancel-in-progress: false

defaults:
  run:
    shell: powershell

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/paper-universe
  SERVICE_URL: http://127.0.0.1:8090
  OUT: ${{ github.workspace }}\deploy-logs

jobs:
  deploy:
    # only a successful CI run triggered by a push to this repository (never a fork)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, Windows]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check Docker is running
        run: |
          docker version --format "Docker engine {{.Server.Version}} ({{.Server.Os}})"
          if ($LASTEXITCODE -ne 0) { throw "Docker Desktop is not running on the runner PC" }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the image CI just pushed
        id: pull
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # CI tags every push as sha-<7 chars> (docker/metadata-action type=sha,format=short)
          $tag = if ($env:HEAD_SHA) { "sha-" + $env:HEAD_SHA.Substring(0, 7) } else { "latest" }
          $ref = "$($env:IMAGE):$tag"
          docker pull $ref
          if ($LASTEXITCODE -ne 0) { throw "pull failed: $ref" }
          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "deploying $ref"

      # Independent process, started before anything changes; it must see the service healthy first.
      - name: Start monitor and confirm the current service responds
        run: |
          New-Item -ItemType Directory -Force $env:OUT | Out-Null
          Remove-Item "$env:OUT\*" -Force -ErrorAction SilentlyContinue
          # Start-Process (PowerShell 5.1) joins arguments without quoting, so quote every path
          $argv = "-NoProfile -ExecutionPolicy Bypass -File `"$env:GITHUB_WORKSPACE\deploy\monitor.ps1`" " +
                  "-Url `"$env:SERVICE_URL`" -OutFile `"$env:OUT\monitor.jsonl`" -StopFile `"$env:OUT\stop`" -AfterSeconds 30"
          $p = Start-Process powershell -PassThru -WindowStyle Hidden -ArgumentList $argv
          $p.Id | Out-File "$env:OUT\monitor.pid" -Encoding ascii
          Write-Host "monitor pid $($p.Id)"
          $deadline = (Get-Date).AddSeconds(60); $seen = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            if (Test-Path "$env:OUT\monitor.jsonl") {
              $last = Get-Content "$env:OUT\monitor.jsonl" -Tail 1 | ConvertFrom-Json
              if ($last.status -eq 200 -and $last.valid) { $seen = $last; break }
              # first run after the old single-container deploy: no analyze API yet, but the service is up
              if ($last.status -in 404, 405) { $seen = $last; Write-Host "current version has no analyze API yet (status $($last.status)); service is up"; break }
            }
          }
          if (-not $seen) { Write-Host "no running service answered before deploy (first deployment?)" }
          else { Write-Host "pre-deploy response: status=$($seen.status) version=$($seen.version) keywords=$($seen.keywords -join ', ')" }

      - name: Blue-green deploy
        env:
          REF: ${{ steps.pull.outputs.ref }}
        run: |
          & "$env:GITHUB_WORKSPACE\deploy\bluegreen.ps1" -Ref $env:REF -Port 8090 -Events "$env:OUT\events.jsonl"

      - name: Keep monitoring 30 s after deploy
        if: always()
        run: |
          New-Item -ItemType File -Force "$env:OUT\stop" | Out-Null
          $id = Get-Content "$env:OUT\monitor.pid" -ErrorAction SilentlyContinue
          if ($id) { Wait-Process -Id $id -Timeout 90 -ErrorAction SilentlyContinue; Stop-Process -Id $id -Force -ErrorAction SilentlyContinue }
          Write-Host "monitor finished: $((Get-Content "$env:OUT\monitor.jsonl" -ErrorAction SilentlyContinue | Measure-Object).Count) requests"
          exit 0

      - name: Write Summary
        if: always()
        env:
          REF: ${{ steps.pull.outputs.ref }}
        run: |
          & "$env:GITHUB_WORKSPACE\deploy\summary.ps1" -OutDir $env:OUT -Url $env:SERVICE_URL -Results "$env:GITHUB_WORKSPACE\eval\results.json" -Image $env:REF
          Get-Content "$env:OUT\monitor.jsonl" -Encoding UTF8 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          exit 0

      - name: Upload logs (UTF-8)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-monitor-${{ github.run_id }}
          path: deploy-logs/
          if-no-files-found: warn
